<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فريق المبدعين | Creative Team Portfolio</title>
    <!-- خطوط جوجل وأيقونات FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --neon-cyan: #00f0ff;
            --neon-purple: #8a2be2;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-glow: rgba(0, 240, 255, 0.25);
            --danger-color: #ff4757;
            --success-color: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            width: 100%;
            line-height: 1.6;
        }

        /* شريط التنقل المتجاوب */
        .navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-glow);
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
        }

        .admin-trigger-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .admin-trigger-btn:hover {
            background: var(--neon-cyan);
            color: #0b0f19;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* قسم المقدمة */
        .hero {
            padding: 3rem 5% 1.5rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--neon-cyan);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 700px;
            margin: 0 auto 1.5rem;
        }

        .visitor-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* الأقسام والبطاقات */
        .section-header {
            text-align: center;
            margin: 3rem 5% 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 2px;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            padding: 0 5%;
        }

        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

        .avatar-wrap {
            width: 130px;
            height: 130px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a2035;
            display: block;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .member-role {
            color: var(--neon-cyan);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .member-bio {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25d366;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            width: 100%;
        }

        /* قسم المدرسة والخريطة */
        .school-container {
            padding: 0 5% 3rem;
        }

        .school-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .map-frame {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 12px;
            margin-top: 1rem;
        }

        /* قسم إرسال الرسالة */
        .contact-section {
            padding: 0 5% 4rem;
        }

        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--neon-cyan);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f1422;
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        /* النوافذ المنبثقة للتحكم */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }

        .modal-box {
            background: #111625;
            border: 1px solid var(--neon-cyan);
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }

        .login-box {
            max-width: 380px;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 0.8rem;
            left: 1rem;
            font-size: 1.6rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .admin-nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #232b45;
            padding-bottom: 0.6rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid #334168;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: var(--neon-cyan);
            color: #0b0f19;
            border-color: var(--neon-cyan);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .msg-item {
            background: #161c2e;
            padding: 0.9rem;
            border-radius: 8px;
            border: 1px solid #2a3454;
            margin-bottom: 0.8rem;
            text-align: right;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .editable-active {
            outline: 2px dashed var(--neon-cyan) !important
