<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق المبدعين | Creative Team Portfolio</title>
    <!-- خطوط جوجل وأيقونات FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.75);
            --neon-cyan: #00f0ff;
            --neon-purple: #8a2be2;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-glow: rgba(0, 240, 255, 0.25);
            --danger-color: #ff4757;
            --success-color: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* شريط التنقل */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-glow);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
        }

        .admin-trigger-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .admin-trigger-btn:hover {
            background: var(--neon-cyan);
            color: #0b0f19;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* قسم المقدمة */
        .hero {
            padding: 4rem 8% 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--neon-cyan);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 750px;
            margin: 0 auto 2rem;
        }

        .visitor-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: var(--neon-cyan);
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* الأقسام والبطاقات */
        .section-header {
            text-align: center;
            margin: 4rem 0 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 2px;
        }

        .section-desc {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            padding: 0 8%;
        }

        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 1.8rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .member-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.2);
        }

        .avatar-wrap {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a2035;
        }

        .member-name {
            font-size: 1.3rem;
            font-weight: 700
